name: Relatar defeito
description: Informe um comportamento incorreto ou regressão reproduzível.
title: "fix: "
labels: [bug, triage]
body:
  - type: textarea
    id: comportamento
    attributes:
      label: Comportamento observado
      description: O que aconteceu e qual foi o impacto?
    validations:
      required: true
  - type: textarea
    id: reproducao
    attributes:
      label: Passos para reproduzir
      description: Inclua endpoint, corpo sem segredos e estado necessário.
      placeholder: |
        1. Inicie o perfil demo
        2. Envie ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: Comportamento esperado
    validations:
      required: true
  - type: input
    id: versao
    attributes:
      label: Versão ou commit
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: evidencias
    attributes:
      label: Evidências adicionais
      description: Logs, correlação, resposta HTTP ou captura sem dados sensíveis.
