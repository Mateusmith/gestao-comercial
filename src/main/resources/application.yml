server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful
  error:
    include-message: never

spring:
  application:
    name: gestao-comercial
  datasource:
    url: ${COMMERCECORE_BANCO_URL:jdbc:postgresql://localhost:54325/commercecore}
    username: ${COMMERCECORE_BANCO_USUARIO:commercecore}
    password: ${COMMERCECORE_BANCO_SENHA:commercecore}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
        order_inserts: true
        order_updates: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${COMMERCECORE_EMISSOR_JWT:http://localhost:18083/realms/commercecore}
          jwk-set-uri: ${COMMERCECORE_URL_CHAVES_JWK:http://localhost:18083/realms/commercecore/protocol/openid-connect/certs}
  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: true
  modulith:
    runtime:
      verification-enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,modulith
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when-authorized
  observations:
    enable:
      spring.security.authorizations: false
    key-values:
      aplicacao: commercecore
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  api-docs:
    path: /v3/api-docs

logging:
  pattern:
    level: "%5p [correlacao:%X{correlationId:-sem-correlacao}]"

commercecore:
  seguranca:
    audiencia: ${COMMERCECORE_AUDIENCIA:commercecore-api}
  observabilidade:
    usuario: ${COMMERCECORE_METRICAS_USUARIO:prometheus}
    senha: ${COMMERCECORE_METRICAS_SENHA:Prometheus@123}
